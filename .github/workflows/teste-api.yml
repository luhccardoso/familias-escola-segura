name: Teste da API da pesquisa
on: push
jobs:
  teste:
    runs-on: ubuntu-latest
    env:
      U: https://script.google.com/macros/s/AKfycbxkkPIxpuEEaSbU3d7OK0ybe0qqEvjhVErtVYBuDZlqokIhdHiImYYEeZFARvKNHiA/exec
    steps:
      - name: GET
        run: |
          echo "RESULTADO_GET:"; curl -sS -L -m 60 "$U"; echo
      - name: POST invalido
        run: |
          echo "RESULTADO_POST:"; curl -sS -L -m 60 -H "Content-Type: text/plain;charset=utf-8" --data '{"versao":"teste","respostas":{}}' "$U"; echo
