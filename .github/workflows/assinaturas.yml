name: Atualizar assinaturas

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: assinaturas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # sempre a versão mais recente, mesmo em "Re-run"
          fetch-depth: 0
      - name: Ler o total na Change.org
        run: python3 scripts/contar_assinaturas.py
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- assets/assinaturas.json; then
            echo "Sem mudança."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/assinaturas.json
          git commit -m "Atualiza total de assinaturas"
          # Se o site recebeu outra alteração enquanto a tarefa rodava,
          # junta as duas e tenta de novo (até 3 vezes).
          for tentativa in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push recusado (tentativa $tentativa). Tentando de novo..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
